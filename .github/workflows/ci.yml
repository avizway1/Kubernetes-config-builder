name: CI

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # The server has no dependencies, so there is no go.sum to cache.
          cache: false
      - name: Install kubeconform
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare offline schemas
        run: python3 backend/download-schemas.py
      - name: Validate lesson manifests with kubeconform
        run: node --test tests/lesson-manifests.check.mjs
      - name: Test the Go server
        working-directory: backend
        run: go test ./...
      - name: Test lessons, labs, and setup in Chromium
        shell: bash
        run: |
          (cd frontend && npx playwright-core install --with-deps chromium)
          (cd frontend && exec npm run dev -- --host 127.0.0.1 --port 5173 --strictPort) > "$RUNNER_TEMP/frontend.log" 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail -o /dev/null http://127.0.0.1:5173/; then
              break
            fi
            sleep 1
          done
          if ! (cd frontend && npm run test:browser); then
            cat "$RUNNER_TEMP/frontend.log"
            exit 1
          fi
      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm audit --package-lock-only --json > "$RUNNER_TEMP/npm-audit.json" || true
          python3 ../tests/check-npm-audit.py "$RUNNER_TEMP/npm-audit.json" ../security/accepted-dependency-risks.json package-lock.json
      - name: Install verified Trivy scanner
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --remote-name "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$archive" | sha256sum --check
          mkdir -p trivy-bin
          tar -xzf "$archive" -C trivy-bin trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Audit Go dependencies
        if: ${{ !cancelled() }}
        run: trivy fs --scanners vuln --pkg-types library --severity HIGH,CRITICAL --exit-code 1 --no-progress backend
      - name: Test the npm dependency risk policy
        if: ${{ !cancelled() }}
        run: python3 tests/test_npm_audit_policy.py

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and start the Docker distribution
        run: docker compose -f compose.yaml -f compose.build.yaml up -d --build
      - name: Check the dashboard page and its caching
        run: python3 tests/check-docker-release.py
      - name: Scan the packaged runtime
        shell: bash
        run: |
          image=$(docker compose -f compose.yaml -f compose.build.yaml config --images)
          cd "$RUNNER_TEMP"
          archive=trivy_0.76.2_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --remote-name "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/$archive"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$archive" | sha256sum --check
          tar -xzf "$archive" trivy
          ./trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$image"
      - name: Collect logs and stop the distribution
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.build.yaml logs --no-color
          docker compose -f compose.yaml -f compose.build.yaml down

  wsl:
    # The setup page's Windows path: Ubuntu on WSL 2, the Windows card's install commands, and the check command.
    # The runner has no Docker Desktop or AWS sign-in, so those two read as not ready. See specs/setup-check.md.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      WSL_UTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Ubuntu on WSL 2
        timeout-minutes: 15
        # The Windows card's command. --no-launch skips the user name prompt, and --web-download works without the Microsoft Store.
        run: |
          wsl --install -d Ubuntu --no-launch --web-download
          wsl --list --verbose
      - name: Follow the Windows card and run the check in Ubuntu
        run: node tests/setup-check-wsl.check.mjs

  install-linux:
    # scripts/install-linux.sh in fresh Ubuntu and Debian containers, as a learner with sudo, run twice.
    # A container can't start Docker Engine, so Docker reads as not running. See specs/install-scripts.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            images: ubuntu:26.04 debian:13
          - runner: ubuntu-24.04-arm
            images: ubuntu:26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run the Linux install script twice in each container
        env:
          LKME_INSTALL_IMAGES: ${{ matrix.images }}
        run: node --test tests/install-linux.check.mjs

  install-macos:
    # scripts/install-macos.sh on Apple silicon and Intel, run twice. The runners can't run Docker Desktop.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Run the macOS install script twice
        env:
          LKME_SKIP_DOCKER: '1'
        run: node --test tests/install-macos.check.mjs

  install-windows:
    # scripts/install-windows.ps1 with Ubuntu on WSL 2, run twice. The runner can't run Docker Desktop.
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      WSL_UTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install Ubuntu on WSL 2
        timeout-minutes: 15
        # --no-launch skips the user name prompt, and --web-download works without the Microsoft Store.
        run: |
          wsl --install -d Ubuntu --no-launch --web-download
          wsl --list --verbose
      - name: Run the Windows install script twice
        run: node --test tests/install-windows.check.mjs
